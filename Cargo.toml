[package]
name = "search-engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.86"
license = "MIT"
description = "Embeddable typed metadata and lexical search with a durable Tantivy index"
repository = "https://github.com/moritzbrantner/search-engine"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tantivy = "=0.27.0"
thiserror = "2"

[dev-dependencies]
tempfile = "=3.27.0"
