name: prepare-generated-files

# One-time, branch-scoped maintenance run. Deletes itself after committing
# files generated by the real tools. It is not part of the final CI pipeline.
on:
  push:
    branches: [feat/durable-tantivy-index]

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: feat/durable-tantivy-index
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Restore real managed conventions
        shell: bash
        run: |
          git clone --depth 1 https://github.com/moritzbrantner/coding-tooling.git /tmp/coding-tooling
          git clone --depth 1 https://github.com/moritzbrantner/coding-agent-conventions.git /tmp/coding-agent-conventions
          (cd /tmp/coding-tooling && bun install --frozen-lockfile)
          bun /tmp/coding-tooling/src/cli.ts conventions update --root "$GITHUB_WORKSPACE" --conventions-root /tmp/coding-agent-conventions
          bun /tmp/coding-tooling/src/cli.ts conventions check --root "$GITHUB_WORKSPACE"
      - name: Generate deterministic Rust lock and formatting
        shell: bash
        run: |
          cargo generate-lockfile
          cargo fmt --all
      - name: Commit actual generated output and remove temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/prepare-generated-files.yml
          git add Cargo.lock .conventions conventions.lock.json src tests examples
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "chore: install live managed conventions, refresh lock and format"
            git push origin HEAD:feat/durable-tantivy-index
          fi
